[browser]
# 사용자 데이터 수집 비활성화
gatherUsageStats = false

[server]
# 서버 설정
port = 8502
headless = true
# 최대 업로드 파일 크기 (MB)
maxUploadSize = 300

[theme]
# 문서 읽기 중심의 밝은 테마
base = "light"
primaryColor = "#334E68"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F8"
textColor = "#172B4D"
font = "sans serif"
